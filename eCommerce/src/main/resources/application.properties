spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG

# Hibernate 6+/7 detecta el dialecto solo (MySQL5Dialect ya no existe).

# Mantiene los nombres de tabla/columna del proyecto original (Orden, DetalleOrden, usuario_id...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Las lecturas se hacen dentro de transacciones en los adaptadores de persistencia
spring.jpa.open-in-view=false

# Carpeta donde se guardan y desde donde se sirven las imagenes de producto
app.storage.images-dir=images
